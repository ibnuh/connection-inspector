# Cloudflare Pages configuration file
# This file is optional but can be useful for local development and manual deployments
# Most settings are configured through the Cloudflare Pages dashboard

name = "whoami"
compatibility_date = "2024-01-01"

# Pages configuration
# Note: For cloudflare-pages preset, Nitro outputs to 'dist' directory
# The pages_build_output_dir setting is overridden by Nitro and will be ignored
pages_build_output_dir = "dist"

# Environment variables (if needed)
# [vars]
# EXAMPLE_VAR = "example-value"

# Build configuration
# These are typically set in the Cloudflare Pages dashboard, but can be specified here
# build_command = "npm run build"
# build_output_dir = ".output/public"

